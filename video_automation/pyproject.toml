[project]
name = "video-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "aiofiles",
    "python-dotenv",
    "requests",
    "google-api-python-client",
    "google-auth-oauthlib",
    "PyYAML",
]

[tool.vercel]
entrypoint = "api:app"
